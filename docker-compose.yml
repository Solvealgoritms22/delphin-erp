services:
  db:
    image: postgres:15-alpine
    container_name: dolphin-erp-db
    restart: always
    environment:
      POSTGRES_USER: dolphin
      POSTGRES_PASSWORD: dolphin_password
      POSTGRES_DB: dolphin_erp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dolphin-erp-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
