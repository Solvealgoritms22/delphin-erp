<!doctype html>
<html
  id="fuse"
  lang="es"
>
  <head>
    <base href="/" />
    <title>Dolphin ERP | Sistema de Planificación de Recursos Empresariales</title>

    <!-- Meta -->
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Dolphin ERP es la solución definitiva de software empresarial. Gestiona finanzas, inventarios, recursos humanos y ventas en una única plataforma en la nube."
    />
    <meta name="keywords" content="ERP, software empresarial, finanzas, inventario, ventas, gestión de negocios, nube, Dolphin ERP" />
    <meta name="author" content="Dolphin ERP" />
    <meta name="robots" content="index, follow" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' app: https: http://localhost:3000 ws: wss:;" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dolphin ERP | Sistema Inteligente" />
    <meta property="og:description" content="Gestiona toda tu empresa desde una única plataforma rápida, segura y en la nube." />
    <meta property="og:image" content="/images/logo/logo_dolphin_light.png" />
    
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="favicon.png"
    />

    <!-- Preload fonts -->
    <link
      rel="preload"
      href="/fonts/geist/Geist.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist/Geist-Italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist/GeistMono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist/GeistMono-Italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- prettier-ignore -->
    <script>
      !function(){try{const e=document.documentElement.classList;e.remove("scheme-dark","scheme-light");const c=localStorage.getItem("scheme"),t=window.matchMedia("(prefers-color-scheme: dark)").matches,s="dark"===c||"system"===c&&t?"scheme-dark":"scheme-light";e.add(s)}catch(e){}}();
    </script>

    <div id="splash-screen" class="splash-screen">
      <style>
        .splash-screen {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #ffffff;
          z-index: 99999;
          user-select: none;
        }
        html.scheme-dark .splash-screen {
          background-color: #09090b;
        }
        .splash-content {
          position: relative;
          width: 130px;
          height: 130px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .splash-spinner-track {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          border-radius: 50%;
          border: 3px solid rgba(0, 0, 0, 0.06);
        }
        html.scheme-dark .splash-spinner-track {
          border: 3px solid rgba(255, 255, 255, 0.08);
        }
        .splash-spinner-ring {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          border-radius: 50%;
          border: 3px solid transparent;
          border-top-color: #2563eb;
          border-right-color: #60a5fa;
          animation: splash-spin 1.2s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
        }
        html.scheme-dark .splash-spinner-ring {
          border-top-color: #3b82f6;
          border-right-color: #93c5fd;
          filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.35));
        }
        .splash-content .logo {
          width: 66px;
          height: auto;
          position: relative;
          z-index: 2;
          object-fit: contain;
          animation: splash-pulse 2.4s ease-in-out infinite;
        }
        html.scheme-dark .logo-light {
          display: none;
        }
        html.scheme-light .logo-dark {
          display: none;
        }
        html:not(.scheme-dark):not(.scheme-light) .logo-dark {
           display: none;
        }
        @keyframes splash-pulse {
          0%, 100% {
            opacity: 1;
            transform: scale(1);
          }
          50% {
            opacity: 0.85;
            transform: scale(0.96);
          }
        }
        @keyframes splash-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
      <div class="splash-content">
        <div class="splash-spinner-track"></div>
        <div class="splash-spinner-ring"></div>
        <img class="logo logo-light" src="/images/logo/logo_dolphin_light.png" alt="Dolphin ERP" />
        <img class="logo logo-dark" src="/images/logo/logo_dolphin_dark.png" alt="Dolphin ERP" />
      </div>
    </div>
    <app-root></app-root>
  </body>
</html>
