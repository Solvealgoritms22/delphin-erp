<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Grayscale Theme -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="mapGrayscale">
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/>
    </filter>
  </defs>

  <!-- Base Terrain -->
  <rect width="800" height="360" fill="url(#bgGradLight)"/>

  <!-- City Blocks / Building Parcels in Grayscale -->
  <g fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5">
    <rect x="20" y="20" width="70" height="50" rx="4"/>
    <rect x="105" y="20" width="85" height="50" rx="4"/>
    <rect x="20" y="85" width="60" height="65" rx="4"/>
    <rect x="95" y="85" width="95" height="40" rx="4"/>
    <polygon points="205,20 280,20 260,75 205,75" />
    <rect x="210" y="90" width="80" height="60" rx="4"/>
    <rect x="305" y="20" width="110" height="70" rx="4"/>
    <rect x="305" y="105" width="65" height="45" rx="4"/>
    <rect x="385" y="105" width="70" height="75" rx="4"/>
    
    <!-- Center blocks -->
    <rect x="470" y="25" width="90" height="60" rx="4"/>
    <rect x="575" y="25" width="115" height="60" rx="4"/>
    <rect x="470" y="100" width="80" height="50" rx="4"/>
    <polygon points="565,100 670,100 650,155 565,155" />
    <rect x="705" y="25" width="75" height="85" rx="4"/>
    <rect x="685" y="125" width="95" height="60" rx="4"/>

    <!-- Bottom blocks -->
    <rect x="25" y="170" width="80" height="80" rx="4"/>
    <rect x="120" y="140" width="75" height="70" rx="4"/>
    <rect x="120" y="225" width="90" height="55" rx="4"/>
    <rect x="25" y="265" width="75" height="75" rx="4"/>
    <polygon points="225,165 295,165 280,230 225,230" />
    <rect x="225" y="245" width="85" height="95" rx="4"/>
    <rect x="325" y="195" width="95" height="65" rx="4"/>
    <rect x="325" y="275" width="110" height="65" rx="4"/>

    <rect x="450" y="195" width="95" height="60" rx="4"/>
    <rect x="450" y="270" width="80" height="70" rx="4"/>
    <rect x="560" y="175" width="90" height="75" rx="4"/>
    <rect x="545" y="265" width="105" height="75" rx="4"/>
    <rect x="665" y="200" width="115" height="65" rx="4"/>
    <rect x="665" y="280" width="115" height="60" rx="4"/>
  </g>

  <!-- Parks / Green spaces in muted slate -->
  <path d="M 205,20 C 230,40 250,50 260,75 L 205,75 Z" fill="#e2e8f0"/>
  <rect x="470" y="100" width="80" height="50" rx="4" fill="#e2e8f0"/>
  <circle cx="150" cy="180" r="18" fill="#e2e8f0"/>

  <!-- Waterway / River in muted gray -->
  <path d="M -10,310 C 120,300 180,240 260,200 C 340,160 410,180 500,140 C 600,90 680,80 810,40 L 810,75 C 680,115 600,125 500,175 C 410,215 340,195 260,235 C 180,275 120,335 -10,345 Z" fill="url(#riverGrad)"/>

  <!-- Secondary Roads Network -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Horizontal street lines -->
    <path d="M 0,80 L 800,80" stroke-width="7"/>
    <path d="M 0,160 L 310,160 M 460,160 L 800,160" stroke-width="6"/>
    <path d="M 0,260 L 800,260" stroke-width="7"/>
    
    <!-- Vertical street lines -->
    <path d="M 100,0 L 100,360" stroke-width="6"/>
    <path d="M 200,0 L 200,360" stroke-width="7"/>
    <path d="M 300,0 L 300,360" stroke-width="6"/>
    <path d="M 440,0 L 440,360" stroke-width="7"/>
    <path d="M 550,0 L 550,360" stroke-width="6"/>
    <path d="M 680,0 L 680,360" stroke-width="7"/>
  </g>

  <!-- Major Avenue / Curved Highway -->
  <path d="M 0,40 C 220,50 350,120 480,210 C 580,280 700,320 800,330" fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
  <path d="M 0,40 C 220,50 350,120 480,210 C 580,280 700,320 800,330" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
  <path d="M 0,40 C 220,50 350,120 480,210 C 580,280 700,320 800,330" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,6" stroke-linecap="round"/>

  <!-- Bridge over river -->
  <rect x="248" y="210" width="24" height="14" rx="2" fill="#64748b" transform="rotate(30 260 217)"/>

  <!-- Soft Vignette / Inner Shadow around borders -->
  <rect width="800" height="360" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.06"/>
</svg>
