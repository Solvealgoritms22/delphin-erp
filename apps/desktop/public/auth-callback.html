<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dolphin ERP - Autenticación</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .text {
      margin-top: 16px;
      font-size: 14px;
      color: #94a3b8;
    }
    .close-btn {
      display: none;
      margin-top: 20px;
      padding: 8px 18px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="text">Completando inicio de sesión...</div>
  <button id="closeBtn" class="close-btn" onclick="window.close()">Cerrar ventana</button>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var error = params.get('error');
      var type = error ? 'GOOGLE_AUTH_FAILED' : 'GOOGLE_AUTH_SUCCESS';

      // 1. BroadcastChannel (comunicación same-origin ultra rápida e infalible)
      try {
        if (typeof BroadcastChannel !== 'undefined') {
          var bc = new BroadcastChannel('dolphin_auth');
          bc.postMessage({ type: type, error: error });
          bc.close();
        }
      } catch (e) {}

      // 2. window.opener postMessage (comunicación directa con la ventana padre)
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: type, error: error }, '*');
        }
      } catch (e) {}

      // 3. Cerrar ventana inmediatamente (permitido por Chrome porque estamos en el mismo origen)
      function tryClose() {
        try {
          window.open('', '_self', '');
          window.close();
        } catch (e) {}
      }

      tryClose();
      setTimeout(tryClose, 50);
      setTimeout(tryClose, 150);
      setTimeout(tryClose, 400);

      // Si por alguna política externa del navegador no cerró tras 1 segundo, mostrar botón manual
      setTimeout(function() {
        var btn = document.getElementById('closeBtn');
        if (btn) btn.style.display = 'block';
      }, 1200);
    })();
  </script>
</body>
</html>
